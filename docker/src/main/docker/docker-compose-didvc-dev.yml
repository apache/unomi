# DID-VC development stack (T-0.5)
#
# One-command local stack for the unomi-did-vc modules:
#   docker compose -f docker/src/main/docker/docker-compose-didvc-dev.yml up -d
#
# Kafka is the audit/metering bus, PostgreSQL the metadata/audit store,
# Redis the edge protocol state (nonces, replay cache). Elasticsearch /
# OpenSearch is deliberately not included here: it is provisioned by the
# existing setup-elasticsearch.sh / setup-opensearch.sh scripts.
services:
  didvc-kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  didvc-postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: didvc
      POSTGRES_USER: didvc
      POSTGRES_PASSWORD: didvc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U didvc -d didvc"]
      interval: 10s
      timeout: 5s
      retries: 10

  didvc-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
