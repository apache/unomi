# Unomi REST Authentication Configuration
# This file configures authentication settings for Unomi REST endpoints

# V2 Compatibility Mode
# When enabled, allows V2 clients to use Unomi V3 without requiring API keys
# - Public endpoints (like /context.json) require no authentication (like V2)
# - Private endpoints require system administrator authentication (like V2)
# - A default tenant is automatically used for all operations
singletenantcompatibility.enabled = ${org.apache.unomi.rest.authentication.singleTenantCompatibilityModeEnabled:-false}

# Admin default tenant (UNOMI-1008)
# Tenant used when a JAAS-authenticated admin request has no X-Unomi-Tenant-Id header.
# Defaults to "default", where a 3.0→4.0 migration puts the data. Cannot be "system":
# the system context needs an explicit X-Unomi-Tenant-Id: system header.
admin.default.tenant.id = ${org.apache.unomi.rest.authentication.adminDefaultTenantId:-default}
