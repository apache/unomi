# Unomi REST Authentication Configuration
# This file configures authentication settings for Unomi REST endpoints

# Single-tenant compatibility mode
# When enabled, clients written for Unomi 2 or Unomi 3 can use Unomi 4.0 without API keys
# - Public endpoints (like /context.json) require no authentication (like Unomi 2 / 3)
# - Private endpoints require system administrator authentication (like Unomi 2 / 3)
# - Tenant default is used for all REST operations
singletenantcompatibility.enabled = ${org.apache.unomi.rest.authentication.singleTenantCompatibilityModeEnabled:-false}

# Default tenant (UNOMI-1008)
# In 4.0 this is the tenant used when a JAAS-authenticated admin request (REST or GraphQL) has no
# X-Unomi-Tenant-Id header. Single-tenant compatibility mode does not use it yet: its REST requests
# always run on tenant "default" (UNOMI-1029), so keep this at "default" while that mode is on.
# Defaults to "default"; set it to the tenant id chosen during the 3.0→4.0 migration. Cannot be "system":
# the system context needs an explicit X-Unomi-Tenant-Id: system header.
default.tenant.id = ${org.apache.unomi.rest.authentication.defaultTenantId:-default}
