# Third-party servers for single-tenant compatibility mode (X-Unomi-Peer).
#
# A provider whose key is empty, shorter than 16 characters, or equal to the
# well-known example value below is disabled at startup with an error in the log
# unless allowExampleKey=true (logs a warning every start).
# Never set allowExampleKey=true in production: the example key is public, so
# anyone who can reach Unomi from an allowed address holds it.
#
# abilities (optional, comma-separated): setEventId, chooseProfileId, mergeOnLogin,
# updateOtherProfiles. Names are case-sensitive. A provider with no abilities
# property gets all four (Unomi 3.0 peer behaviour). An empty value grants no
# ability (protected events only). A value that names no known ability disables
# the provider with an error in the log.
#
# ipAddresses: addresses or CIDR ranges the key is accepted from. Required: a
# provider with an empty list is refused from every address, with an error in
# the log at startup. The key alone is never enough.
#
# trustedProxies: when the direct connection address is in this list, the
# X-Forwarded-For header is read from its last entry backwards and the first
# entry that is not itself a trusted proxy is used for the provider IP check.
# Leave empty to always use the direct address.

allowExampleKey=${org.apache.unomi.thirdparty.allowExampleKey:-false}
trustedProxies=${org.apache.unomi.thirdparty.trustedProxies:-}

# Example provider (localhost only). Replace the key before production use.
thirdparty.provider1.key=${org.apache.unomi.thirdparty.provider1.key:-670c26d1cc413346c3b2fd9ce65dab41}
thirdparty.provider1.ipAddresses=${org.apache.unomi.thirdparty.provider1.ipAddresses:-127.0.0.1,::1}
thirdparty.provider1.allowedEvents=${org.apache.unomi.thirdparty.provider1.allowedEvents:-login,updateProperties}
thirdparty.provider1.abilities=${org.apache.unomi.thirdparty.provider1.abilities:-setEventId,chooseProfileId,mergeOnLogin,updateOtherProfiles}
