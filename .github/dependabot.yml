version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "org.apache.commons:commons-email"
        versions:
          - "> 1.3.3"
      # CXF feature bundles pin their own Jackson. Keep Unomi on 3.6.8 until a
      # CXF bump is paired with a matching jackson.version (3.6.12 pulls 2.22).
      - dependency-name: "org.apache.cxf*"
      # Salesforce connector CometD/Jetty stack refresh is tracked in UNOMI-989.
      - dependency-name: "org.cometd.java:*"
        update-types:
          - "version-update:semver-major"
      # graphql-java-annotations majors need a matching graphql-java (+ scalars) upgrade.
      - dependency-name: "io.github.graphql-java:graphql-java-annotations"
        update-types:
          - "version-update:semver-major"
