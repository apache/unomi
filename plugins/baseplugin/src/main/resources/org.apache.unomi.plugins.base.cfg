maxProfilesInOneMerge=${org.apache.unomi.plugins.base.maxProfilesInOneMerge:-50}

# When true, a tenant private key or an administrator login may only merge profiles, record a merge
# identifier, update another profile or write systemProperties on a request received over HTTPS.
# Behind a proxy that terminates TLS, the proxy must be listed in org.apache.unomi.ip.trustedProxies
# and send X-Forwarded-Proto: https. Leave false for development; set true in production.
# X-Unomi-Peer keys in single-tenant compatibility mode are not affected.
requireSecureTransport=${org.apache.unomi.plugins.base.requireSecureTransport:-false}
