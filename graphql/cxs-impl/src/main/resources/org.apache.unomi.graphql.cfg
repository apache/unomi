# Maximum GraphQL query string length in characters (0 disables).
max.query.length.chars=${org.apache.unomi.graphql.max.query.length.chars:-262144}
# Maximum GraphQL HTTP POST body size in bytes (0 disables).
max.request.body.bytes=${org.apache.unomi.graphql.max.request.body.bytes:-524288}
# Maximum GraphQL query depth (0 disables).
max.query.depth=${org.apache.unomi.graphql.max.query.depth:-24}
# Maximum GraphQL query complexity (0 disables).
max.query.complexity=${org.apache.unomi.graphql.max.query.complexity:-3000}
