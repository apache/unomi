# Identity of this Apache Unomi node, written by Unomi itself at startup.
#
# nodeId is generated on the first start and reused afterwards, so the node keeps its place in the
# cluster across restarts. Setting UNOMI_CLUSTER_NODEID (org.apache.unomi.cluster.nodeId) replaces it.
# To get a new id, unset that variable, blank the value below and restart; do not delete this file.
nodeId=

# User friendly name, from UNOMI_CLUSTER_NODENAME (org.apache.unomi.cluster.nodeName) or the host name.
nodeName=
